[project]
name = "bytebarn"
version = "0.1.0"
description = "ByteBarn — a local desktop harness for AI coding agents (a barn full of pixel farmhands)"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.7",
    "qasync>=0.27",
    "aiosqlite>=0.20",
    "pydantic>=2.7",
    "anthropic>=0.34",
    "openai>=1.40",
    "httpx>=0.27",
    "markdown-it-py>=3.0",
    "pygments>=2.18",
    "watchfiles>=0.22",
    "PyYAML>=6.0",
    "mcp>=1.0",
    "boto3>=1.34",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bytebarn*"]
