[project]
name = "bytebarn"
version = "0.3.5"
description = "ByteBarn — a local desktop harness for AI coding agents (a barn full of pixel farmhands)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
keywords = ["ai", "agents", "desktop", "llm", "coding-assistant"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
]
dependencies = [
    "PySide6>=6.7",
    "qasync>=0.27",
    "aiosqlite>=0.20",
    "pydantic>=2.7",
    "anthropic>=0.34",
    "openai>=1.40",
    "httpx>=0.27",
    "markdown-it-py>=3.0",
    "pygments>=2.18",
    "watchfiles>=0.22",
    "PyYAML>=6.0",
    # <2: mcp 2.0 removed mcp.server.fastmcp and renamed streamablehttp_client
    # to streamable_http_client, which engine/mcp.py's HTTP transport still uses.
    "mcp>=1.0,<2",
    "boto3>=1.34",
]

[project.urls]
Homepage = "https://github.com/hhamaker/bytebarn"
Issues = "https://github.com/hhamaker/bytebarn/issues"

[project.scripts]
bytebarn = "bytebarn.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# correctness-focused: pycodestyle errors + pyflakes; formatting stays human
select = ["E4", "E7", "E9", "F"]
ignore = ["E731", "E741"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bytebarn*"]

[tool.setuptools.package-data]
# glob everything: a non-.txt asset silently vanished from the
# 0.1.0 wheel because this was scoped to *.txt
bytebarn = ["assets/prompts/*"]
